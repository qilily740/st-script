<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剧本分页工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .panel {
            background: #fff;
            width: 420px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .title {
            text-align: center;
            font-weight: bold;
            color: #333;
        }
        .tab-nav {
            display: flex;
            gap: 5px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            background: #eee;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-size: 12px;
        }
        .tab-btn.active {
            background: #333;
            color: #fff;
            border-color: #000;
        }
        .tab-page { display: none; flex-direction: column; gap: 12px; }
        .tab-page.active { display: flex; }

        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-height: 120px;
            overflow-y: auto;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        .page-btn {
            background: #eee;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #ccc;
            font-family: monospace;
            color: #111;
        }
        .page-btn.active { background: #333; border-color: #000; color: #fff; }

        .preview {
            background: #f8f8f8;
            padding: 15px;
            border-radius: 10px;
            height: 300px;
            overflow-y: auto;
            overflow-x: auto;
            max-width: 100%;
            font-size: 13px;
            line-height: 1.6;
            color: #111;
            white-space: pre-wrap;
            border: 1px solid #ddd;
            text-align: left;
        }
        .preview pre {
            background: #272822;
            color: #f8f8f2;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .preview code {
            font-family: 'Courier New', Courier, monospace;
        }

        .ai-summary {
            background: #f8f8f8;
            padding: 15px;
            border-radius: 10px;
            height: 260px;
            overflow-y: auto;
            overflow-x: auto;
            max-width: 100%;
            font-size: 13px;
            line-height: 1.6;
            border: 1px solid #ddd;
        }
        .api-input, .api-select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 12px;
        }
        .api-row {
            display: flex;
            gap: 8px;
        }
        .api-row button {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }
        .fetch-btn { background: #888; color: #fff; }
        .test-btn { background: #666; color: #fff; }
        .save-btn { background: #333; color: #fff; padding: 10px; border-radius: 6px; border: none; cursor: pointer; }
        .summary-btns {
            display: flex;
            gap: 10px;
        }
        .summary-btns button {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 12px;
            background: #333;
            color: #fff;
        }
        .footer { display: flex; gap: 12px; }
        .footer button { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-go { background: #333; color: #ffffff; }
        .btn-cancel { background: #eee; color: #333; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <div class="panel">
        <div class="title">剧本分页工具</div>
        <div class="tab-nav">
            <div class="tab-btn active" data-tab="page1">预览跳转</div>
            <div class="tab-btn" data-tab="page2">AI概括</div>
            <div class="tab-btn" data-tab="page3">API配置</div>
        </div>

        <div class="tab-page active" id="page1">
            <div class="grid" id="grid"></div>
            <div class="preview" id="preview">点击页码预览内容...</div>
        </div>

        <div class="tab-page" id="page2">
            <div class="summary-btns">
                <button id="re-summary-btn">重新概括</button>
                <button id="batch-10-btn">批量概括前10页</button>
            </div>
            <div class="ai-summary" id="ai-summary">选择开场白后自动生成概括</div>
        </div>

        <div class="tab-page" id="page3">
            <input type="text" class="api-input" id="api-url" placeholder="接口URL 例:.../v1/chat/completions">
            <input type="text" class="api-input" id="api-key" placeholder="API Key">
            <select class="api-select" id="api-model">
                <option value="">请先获取模型</option>
            </select>
            <div class="api-row">
                <button class="fetch-btn" id="fetch-model-btn">获取模型</button>
                <button class="test-btn" id="test-conn-btn">测试连接</button>
            </div>
            <button class="save-btn" id="api-save">保存配置</button>
        </div>

        <div class="footer">
            <button class="btn-cancel" onclick="alert('请在SillyTavern中使用')">取消</button>
            <button class="btn-go" onclick="alert('请在SillyTavern中使用')">跳转此页</button>
        </div>
    </div>

    <script>
        // 模拟SillyTavern数据
        let selectedIdx = 0;
        let currentText = "";
        let chatSwipes = [
            `这是一个开场白示例。
\`\`\`python
print("Hello, World!")
\`\`\`
你好，我是你的助手。`,
            `第二个开场白示例。
\`\`\`javascript
console.log("Hello!");
\`\`\`
今天天气不错。`,
            `第三个开场白示例。
\`\`\`html
<div>测试</div>
\`\`\`
这是一个测试。`
        ];

        // 解析Markdown代码块
        function parseMarkdown(text) {
            let html = text;
            // 匹配```代码块
            html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            return html;
        }

        function getApiConfig() {
            return {
                url: localStorage.getItem('st_api_url') || '',
                key: localStorage.getItem('st_api_key') || '',
                model: localStorage.getItem('st_api_model') || ''
            };
        }

        function saveApiConfig(url, key, model) {
            localStorage.setItem('st_api_url', url);
            localStorage.setItem('st_api_key', key);
            localStorage.setItem('st_api_model', model);
        }

        async function fetchModels(url, key) {
            try {
                let baseUrl = url.trim();
                if(baseUrl.endsWith('/chat/completions')){
                    baseUrl = baseUrl.replace('/chat/completions','');
                }
                const res = await fetch(`${baseUrl}/v1/models`, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + key,
                        'Content-Type': 'application/json'
                    }
                });
                if (!res.ok) return [];
                const data = await res.json();
                if (data.data && Array.isArray(data.data)) {
                    return data.data.map(item => item.id);
                }
                return [];
            } catch(e) {
                console.error("获取模型失败",e);
                return [];
            }
        }

        async function testConnect(url, key) {
            if(!url || !key) return false;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                const res = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + key
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo",
                        messages: [{role:"user",content:"hi"}],
                        max_tokens:5
                    }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                return res.ok;
            } catch(e) {
                return false;
            }
        }

        async function getAISummary(text) {
            const cfg = getApiConfig();
            if (!cfg.url || !cfg.key || !cfg.model) {
                return "请先在API配置页填写并保存接口信息、选择模型";
            }
            const sysPrompt = "帮我精简概括这段人物开场白，控制在50-100字，只给概括结果，不要多余解释";
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 12000);
                const res = await fetch(cfg.url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + cfg.key
                    },
                    body: JSON.stringify({
                        model: cfg.model,
                        messages: [
                            {role:"system", content:sysPrompt},
                            {role:"user", content:text}
                        ],
                        temperature: 0.7
                    }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (!res.ok) return `请求失败：接口状态码 ${res.status}`;
                const data = await res.json();
                if (data.choices && data.choices[0].message) {
                    return data.choices[0].message.content.trim();
                } else {
                    return "接口返回格式异常，请换模型或接口";
                }
            } catch (e) {
                if(e.name === 'AbortError') return "请求超时，请检查接口速度";
                return "请求失败：跨域/接口地址错误/Key无效";
            }
        }

        async function batchSummary10() {
            if(chatSwipes.length === 0) return;
            const cfg = getApiConfig();
            if(!cfg.url || !cfg.key || !cfg.model){
                alert("请先配置并保存API");
                return;
            }
            let maxLen = Math.min(10, chatSwipes.length);
            let result = "===== 批量概括前10页 =====\n";
            for(let i=0;i<maxLen;i++){
                result += `\n【第${i+1}页】\n`;
                result += "正在概括...\n";
                document.getElementById('ai-summary').textContent = result;
                const sum = await getAISummary(chatSwipes[i]);
                result = result.replace("正在概括...", sum);
                document.getElementById('ai-summary').textContent = result;
            }
        }

        // 标签切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function(){
                const tab = this.dataset.tab;
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
                document.getElementById(tab).classList.add('active');
            });
        });

        // 重新概括按钮
        document.getElementById('re-summary-btn').addEventListener('click', async function(){
            if(!currentText){
                alert("请先选择一页内容");
                return;
            }
            document.getElementById('ai-summary').textContent = "正在重新生成概括...";
            const res = await getAISummary(currentText);
            document.getElementById('ai-summary').textContent = res;
        });

        // 批量概括前10页
        document.getElementById('batch-10-btn').addEventListener('click', function(){
            batchSummary10();
        });

        // 获取模型
        document.getElementById('fetch-model-btn').addEventListener('click', async function(){
            const url = document.getElementById('api-url').value.trim();
            const key = document.getElementById('api-key').value.trim();
            if(!url || !key) {
                alert("请先填写接口URL和Key");
                return;
            }
            this.textContent = "加载中...";
            const models = await fetchModels(url, key);
            const sel = document.getElementById('api-model');
            sel.innerHTML = '';
            if(models.length > 0) {
                models.forEach(m=>sel.innerHTML += `<option value="${m}">${m}</option>`);
                alert("获取模型成功");
            } else {
                sel.innerHTML = `<option value="">获取失败</option>`;
                alert("获取模型失败，请检查接口和Key");
            }
            this.textContent = "获取模型";
        });

        // 测试连接
        document.getElementById('test-conn-btn').addEventListener('click', async function(){
            const url = document.getElementById('api-url').value.trim();
            const key = document.getElementById('api-key').value.trim();
            if(!url || !key) {
                alert("请先填写接口URL和Key");
                return;
            }
            this.textContent = "测试中...";
            const ok = await testConnect(url, key);
            alert(ok ? "连接成功" : "连接失败");
            this.textContent = "测试连接";
        });

        // 保存配置
        document.getElementById('api-save').addEventListener('click', function(){
            const url = document.getElementById('api-url').value.trim();
            const key = document.getElementById('api-key').value.trim();
            const model = document.getElementById('api-model').value;
            if(!url || !key || !model) {
                alert("请完整填写URL、Key并选择模型");
                return;
            }
            saveApiConfig(url, key, model);
            alert("配置已保存");
        });

        // 回填配置
        function fillApiForm() {
            const cfg = getApiConfig();
            document.getElementById('api-url').value = cfg.url;
            document.getElementById('api-key').value = cfg.key;
            const sel = document.getElementById('api-model');
            if(cfg.model) {
                sel.innerHTML = `<option value="${cfg.model}" selected>${cfg.model}</option>`;
            }
        }

        // 渲染页码按钮
        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            chatSwipes.forEach((text, i) => {
                const btn = document.createElement('div');
                btn.className = `page-btn ${i === selectedIdx ? 'active' : ''}`;
                btn.textContent = i + 1;
                btn.addEventListener('click', () => {
                    selectedIdx = i;
                    document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentText = chatSwipes[i];
                    document.getElementById('preview').innerHTML = parseMarkdown(currentText);
                    document.getElementById('ai-summary').textContent = "正在生成概括...";
                    getAISummary(currentText).then(res => {
                        document.getElementById('ai-summary').textContent = res;
                    });
                });
                grid.appendChild(btn);
            });
        }

        // 初始化
        function init() {
            fillApiForm();
            selectedIdx = 0;
            currentText = chatSwipes[selectedIdx];
            renderGrid();
            document.getElementById('preview').innerHTML = parseMarkdown(currentText);
            document.getElementById('ai-summary').textContent = "正在生成概括...";
            getAISummary(currentText).then(res => {
                document.getElementById('ai-summary').textContent = res;
            });
        }

        init();
    </script>
</body>
</html>
